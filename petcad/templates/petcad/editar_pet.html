{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PetCad - Editar Pet">
    <title>PetCad | Editar {{ animal.name }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="{% static 'petcad/css/dashboard.css' %}" rel="stylesheet" />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    {% include 'petcad/NavBarPets.html' %}

    <div class="dashboard-layout">
        <aside class="sidebar">
            <ul class="sidebar-menu">
                <li>
                    <a href="{% url 'dashboard' %}">
                        <div class="emoji"><i class="ph ph-house"></i></div> Dashboard
                    </a>
                </li>
                <li>
                    <a href="{% url 'tutores' %}">
                        <div class="emoji"><i class="ph ph-user"></i></div> Tutores
                    </a>
                </li>
                <li class="active">
                    <a href="{% url 'todos_pets' %}">
                        <div class="emoji"><i class="ph-fill ph-paw-print"></i></div> Pets
                    </a>
                </li>
                <li>
                    <a href="#">
                        <div class="emoji"><i class="ph ph-gear"></i></div> Configurações
                    </a>
                </li>
            </ul>
        </aside>

        <main class="main-content">
            {% include 'petcad/_messages.html' %}
            <div class="detail-page-header">
                <button type="button" class="btn-back" onclick="window.location.href='{% url 'ver_pet' animal.pk %}'">
                    <i class="ph ph-arrow-left"></i>
                </button>
                <div>
                    <h2>Editar pet</h2>
                    <p class="subtitle">Atualize os dados de {{ animal.name }}</p>
                </div>
            </div>

            <div class="form-card">
                <form method="post" class="pet-form pet-form-edit pet-form-page" id="form-editar-pet">
                    {% csrf_token %}
                    {% include 'petcad/_pet_form_fields.html' %}

                    <div class="form-actions">
                        <button type="button" class="btn-cancel" onclick="window.location.href='{% url 'ver_pet' animal.pk %}'">Cancelar</button>
                        <button type="submit" class="btn-save btn-save-edit">Salvar alterações</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="{% static 'petcad/js/novo_pet.js' %}"></script>
</body>
</html>
