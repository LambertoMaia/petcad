{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PetCad - O sistema definitivo para gestão de pets e tutores. Simples, rápido e eficiente.">
    <title>PetCad | Gestão Inteligente para o seu Negócio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="{% static 'petcad/css/style.css' %}">
</head>
<body>
    <main>
        <section class="hero">
            <div class="auth-container" id="auth-section">
                <div class="login-branding">
                    <div class="logo">
                        <i class="ph-fill ph-paw-print"></i>
                        <span>PetCad</span>
                    </div>
                    <p>Soluções para negócios pet</p>
                </div>
                <div class="auth-tabs">
                    <div class="auth-tab active" id="tab-login" onclick="switchTab('login')">Login Administrador</div>
                </div>

                {% if messages %}
                <div class="messages">
                    {% for message in messages %}
                    <div class="alert {% if message.tags %}alert-{{ message.tags }}{% endif %}">
                        {{ message }}
                    </div>
                    {% endfor %}
                </div>
                {% endif %}
                <!-- Login -->
                <form id="form-login" class="auth-form active" method="POST" action="{% url 'user_login' %}">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" name="email" id="login-email" placeholder="seu@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Senha</label>
                        <input type="password" id="login-password" name="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-primary">Entrar no Sistema</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 PetCad. Todos os direitos reservados.</p>
    </footer>

    <script src="{% static 'petcad/js/script.js' %}"></script>
</body>
</html>
